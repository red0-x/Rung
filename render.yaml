# Render blueprint for the Rung server (MCP + webhooks + JSON API).
# The dashboard (web/) deploys to Vercel, not here. See docs/DEPLOY.md.
services:
  - type: web
    name: rung-server
    runtime: node
    region: virginia # same region as the Supabase project (us-east-1)
    plan: free
    rootDir: .
    buildCommand: npm ci --include=dev
    startCommand: npm start -w server
    healthCheckPath: /api/health
    autoDeploy: true
    envVars:
      - key: NODE_VERSION
        value: "22"
      - key: NODE_ENV
        value: production
      - key: NPM_CONFIG_PRODUCTION
        value: "false"
      - key: STORE
        value: supabase
      - key: REQUIRE_VERIFICATION
        value: "false" # texted codes off until 10DLC; see docs/GO_LIVE.md
      - key: DEMO_SHOW_CODES
        value: "true"
      - key: DIAL_API_BASE
        value: https://api.getdial.ai/api/v1
      - key: MCP_SHARED_SECRET
        generateValue: true
      # Set these in the Render dashboard (never committed):
      - key: PUBLIC_URL
        sync: false
      - key: CORS_ORIGIN
        sync: false
      - key: SUPABASE_URL
        sync: false
      - key: SUPABASE_SERVICE_ROLE_KEY
        sync: false
      - key: DIAL_API_KEY
        sync: false
      - key: DIAL_WEBHOOK_SECRET
        sync: false
      - key: DIAL_NUMBER_POOL
        sync: false
